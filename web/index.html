<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Translator</title>
<style>
:root {
  --spring: cubic-bezier(0.35, 1.25, 0.35, 1.25);
  --spring-slow: cubic-bezier(0.45, 0, 0.25, 1);
  --accent: #4A90D9;
  --red: #E74C3C;
  --gray: #95A5A6;
}
[data-theme="dark"] {
  /* v0.4.3: color-scheme 让浏览器用暗色绘制原生控件（select 弹出列表、
     滚动条、数字输入 spinner）——旧版弹出列表是白底+继承的浅灰字，
     白底浅字几乎不可见（用户实测反馈的对比度问题） */
  color-scheme: dark;
  --bg: #000;
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.15);
  --glass-highlight: rgba(255,255,255,0.10);
  --text: #f5f5f7;
  --text-dim: rgba(245,245,247,0.55);
  --shadow: 0 8px 40px rgba(0,0,0,0.6);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #F5F5F7;
  --glass-bg: rgba(255,255,255,0.55);
  --glass-border: rgba(255,255,255,0.50);
  --glass-highlight: rgba(255,255,255,0.35);
  --text: #1d1d1f;
  --text-dim: rgba(29,29,31,0.55);
  --shadow: 0 8px 30px rgba(0,0,0,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  overflow:hidden; display:flex; align-items:center; justify-content:center;
}

/* ---- aurora 背景 ---- */
.bg-wrap { position:fixed; inset:0; z-index:0; overflow:hidden; }
.orb { position:absolute; border-radius:50%; filter:blur(110px); opacity:.8; transition: opacity 1s; }
.orb.cyan { width:52vw; height:52vw; left:-10vw; top:-14vh; background:rgba(74,144,217,0.28); animation:breathe 16s ease-in-out infinite alternate; }
.orb.purple { width:44vw; height:44vw; right:-8vw; bottom:-16vh; background:rgba(175,82,222,0.22); animation:breathe 20s ease-in-out infinite alternate-reverse; }
.orb.teal { width:30vw; height:30vw; right:18vw; top:6vh; background:rgba(90,200,250,0.16); animation:breathe 24s ease-in-out infinite alternate; animation-delay:-8s; }
@keyframes breathe {
  0% { transform:translate(0,0) scale(1); }
  50% { transform:translate(4vw,-5vh) scale(1.15); }
  100% { transform:translate(-3vw,4vh) scale(.92); }
}
@media (prefers-reduced-motion: reduce) { .orb { animation:none !important; } }

/* ---- 主卡片 ---- */
.card {
  position:relative; z-index:1; width:min(560px, calc(100vw - 40px));
  background:var(--glass-bg);
  backdrop-filter:blur(48px) saturate(1.5); -webkit-backdrop-filter:blur(48px) saturate(1.5);
  border:0.8px solid var(--glass-border); border-radius:28px;
  box-shadow:var(--shadow); padding:36px; overflow:hidden;
  animation:cardIn .7s var(--spring) both;
}
@keyframes cardIn { from { opacity:0; transform:translateY(24px) scale(.97);} to { opacity:1; transform:none;} }
.card::after {
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg, var(--glass-highlight) 0%, transparent 50%);
}
h1 { font-size:21px; font-weight:600; letter-spacing:.2px; margin-bottom:4px; }
.sub { font-size:13px; color:var(--text-dim); margin-bottom:26px; }

.field { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
.field input[type=text] {
  flex:1; padding:11px 14px; font-size:14px; color:var(--text);
  background:rgba(127,127,127,0.12); border:0.8px solid var(--glass-border);
  border-radius:12px; outline:none; transition:border .25s, background .25s;
  min-width:0;
}
.field input:focus { border-color:var(--accent); background:rgba(127,127,127,0.18); }
.icon-btn {
  flex:none; width:42px; height:42px; border-radius:12px; cursor:pointer;
  background:var(--glass-bg); backdrop-filter:blur(30px);
  border:0.8px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center; font-size:17px;
  color:var(--text); transition:all .3s var(--spring);
}
.icon-btn:hover { transform:scale(1.07); background:rgba(127,127,127,0.2); }

.btn-translate {
  width:100%; margin-top:10px; padding:14px; font-size:16px; font-weight:600;
  color:#fff; background:linear-gradient(135deg,#4A90D9,#357ABD);
  border:none; border-radius:14px; cursor:pointer;
  transition:all .3s var(--spring); letter-spacing:1px;
}
.btn-translate:hover { transform:scale(1.02); box-shadow:0 6px 24px rgba(74,144,217,0.45); }
.btn-translate:active { transform:scale(.98); }
.btn-translate:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

/* ---- 设置按钮（左下角固定）---- */
.gear {
  position:fixed; left:22px; bottom:22px; z-index:10;
  width:48px; height:48px; border-radius:50%; cursor:pointer;
  background:var(--glass-bg); backdrop-filter:blur(30px);
  border:0.8px solid var(--glass-border);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-highlight);
  display:flex; align-items:center; justify-content:center; font-size:19px;
  transition:all .35s var(--spring);
}
.gear:hover { transform:scale(1.1) rotate(30deg); }
.gear svg { width:20px; height:20px; fill:var(--text-dim); transition:fill .3s; }
.gear:hover svg { fill:var(--text); }

/* ---- 进度区（展开动画）---- */
.progress-zone {
  max-height:0; overflow:hidden; opacity:0;
  transition:max-height .6s var(--spring-slow), opacity .5s, margin .5s;
}
.progress-zone.open { max-height:300px; opacity:1; margin-top:18px; }
.status-line { font-size:13px; color:var(--text-dim); margin-bottom:10px; min-height:18px; }
.bar-track {
  height:9px; border-radius:99px; background:rgba(127,127,127,0.18);
  overflow:hidden; position:relative;
}
.bar-fill {
  height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg,#4A90D9,#67B8F0,#4A90D9);
  background-size:200% 100%;
  transition:width .45s var(--spring-slow);
  animation:flow 2.2s linear infinite;
}
@keyframes flow { from{background-position:0% 0;} to{background-position:200% 0;} }
.bar-fill.indeterminate { width:38% !important; animation:slide 1.4s ease-in-out infinite, flow 2s linear infinite; }
@keyframes slide { 0%{margin-left:-40%;} 100%{margin-left:104%;} }

.ctrl-row { display:flex; gap:10px; margin-top:14px; }
.ctrl-row button {
  flex:1; padding:9px; font-size:13px; cursor:pointer; color:var(--text);
  background:rgba(127,127,127,0.12); border:0.8px solid var(--glass-border);
  border-radius:10px; transition:all .25s var(--spring);
}
.ctrl-row button:hover { background:rgba(127,127,127,0.22); }
.warn-list {
  margin-top:12px; max-height:96px; overflow-y:auto; font-size:11.5px;
  color:#e8a33d; line-height:1.65; word-break:break-all;
}
.done-row { display:none; margin-top:14px; text-align:center; }
.done-row.show { display:block; animation:pop .5s var(--spring) both; }
.done-row a { color:var(--accent); font-size:13.5px; text-decoration:none; }
.done-row a:hover { text-decoration:underline; }
@keyframes pop { from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }

/* ---- 模态层 ---- */
.modal-backdrop {
  position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.32);
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.modal-backdrop.show { opacity:1; pointer-events:auto; }
.modal {
  position:fixed; z-index:101; top:50%; left:50%;
  transform:translate(-50%,-46%) scale(.94); opacity:0; pointer-events:none;
  width:min(520px, calc(100vw - 36px)); max-height:min(78vh, 720px);
  display:flex; flex-direction:column;
  background:var(--glass-bg); backdrop-filter:blur(56px) saturate(1.6);
  -webkit-backdrop-filter:blur(56px) saturate(1.6);
  border:0.8px solid var(--glass-border); border-radius:24px;
  box-shadow:var(--shadow); transition:all .38s var(--spring);
}
.modal.show { transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
.modal-head { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 0; }
.modal-head h2 { font-size:17px; font-weight:600; }
.modal-close { cursor:pointer; font-size:15px; color:var(--text-dim); background:none; border:none; padding:6px 10px; border-radius:8px; }
.modal-close:hover { background:rgba(127,127,127,.15); color:var(--text); }
.modal-body { padding:18px 24px 24px; overflow-y:auto; flex:1; }

/* ---- 设置分类 ---- */
.tab-bar { display:flex; gap:6px; margin-bottom:18px; }
.tab-bar button {
  flex:1; padding:8px 4px; font-size:12.5px; cursor:pointer; border-radius:9px;
  background:transparent; border:0.8px solid transparent; color:var(--text-dim);
  transition:all .25s;
}
.tab-bar button.active { background:rgba(127,127,127,0.16); border-color:var(--glass-border); color:var(--text); }
.pane { display:none; }
.pane.active { display:block; animation:paneIn .3s var(--spring) both; }
@keyframes paneIn { from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:none;} }
.set-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:13px; }
/* v0.5.2: 标签占满左列、控件固定宽贴右——开关/下拉/输入框右侧对齐 */
.set-row > label:not(.switch) { font-size:13.5px; flex:1; min-width:0; }
.set-row input[type=text], .set-row input[type=password], .set-row select {
  width:230px; flex:none; padding:8px 11px; font-size:13px; color:var(--text);
  background:rgba(127,127,127,0.12); border:0.8px solid var(--glass-border);
  border-radius:9px; outline:none;
}
/* v0.5.2: 说明文字改为标题旁问号图标，悬停/点按浮层显示（替代常显 hint） */
.tip {
  display:inline-flex; align-items:center; justify-content:center;
  width:15px; height:15px; margin-left:6px; border-radius:50%;
  background:rgba(127,127,127,0.16); border:0.8px solid var(--glass-border);
  font-size:10px; line-height:1; color:var(--text-dim);
  cursor:help; user-select:none; flex:none; vertical-align:1px;
  transition:color .2s, border-color .2s, background .2s;
}
.tip:hover { color:var(--text); border-color:var(--accent); background:rgba(74,144,217,0.25); }
#uiTip {
  position:fixed; z-index:300; max-width:300px; padding:8px 11px;
  font-size:12px; line-height:1.65; color:var(--text); text-align:left;
  background:rgba(30,30,34,0.97); border:0.8px solid var(--glass-border);
  border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,0.45);
  opacity:0; transform:translateY(3px); pointer-events:none;
  transition:opacity .18s, transform .18s;
}
#uiTip.show { opacity:1; transform:none; }
[data-theme="light"] #uiTip { background:rgba(252,252,254,0.98); box-shadow:0 8px 28px rgba(0,0,0,0.18); }
/* v0.5.2: 术语表行——输入框 + 加载状态 + 管理入口，控件列与其它行同宽右对齐 */
.glz-col { width:230px; flex:none; display:flex; flex-direction:column; gap:5px; }
.glz-statusline { display:flex; align-items:center; justify-content:space-between; gap:8px; }
#glzStatus { font-size:11.5px; color:var(--text-dim); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#glzStatus.ok { color:#7ed88f; }
#glzStatus.bad { color:#ff9a8b; }
/* v0.5.2: 已加载术语表来源清单（翻译时实际合并生效的文件），点按 chip 显示完整路径 */
.glz-loaded { display:flex; flex-wrap:wrap; gap:5px; }
.glz-loaded:empty { display:none; }
.glz-loaded .chip { cursor:help; }
.glz-loaded .chip .st { font-size:11px; color:#7ed88f; flex:none; }
.glz-loaded .chip.unloaded { opacity:.8; }
.glz-loaded .chip.unloaded .st { color:var(--text-dim); }
/* v0.4.3: 下拉弹出选项显式配色——部分浏览器不给 option 继承
   color-scheme，白底弹出列表 + 浅色文字仍然看不清；双保险 */
.set-row select option { background:#2b2b30; color:#f5f5f7; }
[data-theme="light"] .set-row select option { background:#fff; color:#1d1d1f; }
.set-row input:focus, .set-row select:focus { border-color:var(--accent); }
.switch { position:relative; width:44px; height:26px; flex:none; }
.switch input { opacity:0; width:0; height:0; }
.slider {
  position:absolute; inset:0; cursor:pointer; border-radius:99px;
  background:rgba(127,127,127,0.3); transition:.3s;
}
.slider::before {
  content:''; position:absolute; height:20px; width:20px; left:3px; top:3px;
  border-radius:50%; background:#fff; transition:.3s var(--spring);
}
.switch input:checked + .slider { background:var(--accent); }
.switch input:checked + .slider::before { transform:translateX(18px); }
.btn-test {
  width:100%; margin-top:6px; padding:10px; font-size:13px; cursor:pointer;
  background:rgba(74,144,217,0.18); color:var(--accent);
  border:0.8px solid rgba(74,144,217,0.4); border-radius:10px; transition:all .25s;
}
.btn-test:hover { background:rgba(74,144,217,0.3); }
.test-result { font-size:12px; margin-top:8px; min-height:16px; line-height:1.5; word-break:break-all; }
.save-float {
  position:sticky; bottom:0; padding-top:12px; text-align:right;
}
.save-float button {
  padding:9px 22px; font-size:13.5px; font-weight:600; cursor:pointer; color:#fff;
  background:linear-gradient(135deg,#4A90D9,#357ABD); border:none; border-radius:10px;
  transition:transform .25s var(--spring), opacity .3s;
}
.save-float button:hover { transform:scale(1.04); }
.save-float button.saved { background:var(--gray); pointer-events:none; }

/* 术语表管理 */
.chip-row { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 6px; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:3px 10px;
  border-radius:12px; background:rgba(74,144,217,.1); border:0.8px solid var(--glass-border);
  font-size:12.5px; max-width:100%; }
.chip b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.chip .x { cursor:pointer; opacity:.55; font-size:13px; padding:0 1px; }
.chip .x:hover { opacity:1; }
#glossaryBox { width:100%; min-height:160px; resize:vertical; font:12.5px/1.55 Consolas,Menlo,monospace;
  background:rgba(255,255,255,.045); color:var(--text); border:0.8px solid var(--glass-border);
  border-radius:10px; padding:10px 12px; outline:none; margin-top:4px; }
.issue-row { font-size:12.5px; padding:5px 10px; border-radius:8px; margin-top:6px;
  display:flex; gap:8px; align-items:baseline; cursor:pointer; }
.issue-row.err { background:rgba(231,76,60,.12); color:#f0a49a; }
.issue-row.warn { background:rgba(240,173,78,.12); color:#e8c07a; }
.issue-row .ln { font-family:Consolas,monospace; opacity:.7; min-width:52px; flex:none; }
.issue-row .msg { flex:1; }
.issue-row:hover { filter:brightness(1.12); }
.glz-meta { font-size:12px; opacity:.65; margin:6px 2px; }
.rec-row { display:flex; align-items:center; gap:8px; font-size:12.5px; margin:8px 0; opacity:.9; }
.rec-row input[type=number] { width:56px; padding:3px 6px; border-radius:7px;
  background:rgba(255,255,255,.05); border:0.8px solid var(--glass-border); color:var(--text); }

/* ---- 文件浏览器模态 ---- */
.browse-path {
  display:flex; gap:8px; margin-bottom:12px; align-items:center;
}
.browse-path input {
  flex:1; padding:8px 11px; font-size:12.5px; font-family:ui-monospace,monospace;
  color:var(--text); background:rgba(127,127,127,0.12);
  border:0.8px solid var(--glass-border); border-radius:9px; outline:none;
}
.file-list { border:0.8px solid var(--glass-border); border-radius:12px; overflow-y:auto; max-height:320px; min-height:200px; background:rgba(0,0,0,0.08); }
[data-theme="light"] .file-list { background:rgba(0,0,0,0.03); }
.file-item {
  display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:13px;
  cursor:pointer; transition:background .15s; user-select:none;
}
.file-item:hover { background:rgba(127,127,127,0.14); }
.file-item.selected { background:rgba(74,144,217,0.28); }
.file-item .ic { flex:none; width:16px; text-align:center; }
.browse-actions { display:flex; gap:10px; margin-top:14px; justify-content:flex-end; }
.browse-actions button {
  padding:8px 18px; font-size:13px; cursor:pointer; border-radius:10px;
  border:0.8px solid var(--glass-border); background:rgba(127,127,127,0.12); color:var(--text);
  transition:all .25s;
}
.browse-actions .primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.browse-actions button:hover { filter:brightness(1.15); }

/* 历史面板（v0.5.1） */
.hist-list { display:flex; flex-direction:column; gap:8px; }
.hist-item {
  border:0.8px solid var(--glass-border); border-radius:12px; padding:10px 12px;
  background:rgba(127,127,127,0.08); font-size:12.5px;
}
.hist-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.hist-file { font-weight:600; font-size:12.5px; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hist-badge { font-size:11px; padding:2px 8px; border-radius:8px; flex:none; }
.hist-badge.done { background:rgba(126,216,143,.15); color:#7ed88f; }
.hist-badge.error { background:rgba(231,76,60,.15); color:#ff9a8b; }
.hist-badge.cancelled { background:rgba(149,165,166,.18); color:var(--text-dim); }
.hist-meta { color:var(--text-dim); font-size:11.5px; margin-top:4px;
  display:flex; gap:10px; flex-wrap:wrap; }
.hist-actions { display:flex; gap:6px; margin-top:8px; }
.hist-actions button {
  padding:5px 12px; font-size:12px; cursor:pointer; border-radius:8px;
  border:0.8px solid var(--glass-border); background:rgba(127,127,127,0.12);
  color:var(--text); transition:all .2s;
}
.hist-actions button:hover { background:rgba(127,127,127,0.24); }
.hist-warns { margin-top:8px; max-height:150px; overflow-y:auto;
  color:#e8a33d; font-size:11.5px; line-height:1.6; word-break:break-all;
  border-top:0.8px dashed var(--glass-border); padding-top:6px; }
.hist-empty { color:var(--text-dim); font-size:13px; text-align:center;
  padding:30px 0; }

/* 左下角历史按钮 */
.hist-btn {
  position:fixed; left:82px; bottom:22px; z-index:10;
  width:48px; height:48px; border-radius:50%; cursor:pointer;
  background:var(--glass-bg); backdrop-filter:blur(30px);
  border:0.8px solid var(--glass-border);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-highlight);
  display:flex; align-items:center; justify-content:center; font-size:19px;
  transition:all .35s var(--spring);
}
.hist-btn:hover { transform:scale(1.1); }
.hist-btn svg { width:20px; height:20px; fill:var(--text-dim); transition:fill .3s; }
.hist-btn:hover svg { fill:var(--text); }

/* toast */
.toast {
  position:fixed; top:26px; left:50%; transform:translate(-50%,-70px); z-index:200;
  padding:10px 22px; font-size:13.5px; border-radius:99px;
  background:var(--glass-bg); backdrop-filter:blur(30px);
  border:0.8px solid var(--glass-border); box-shadow:var(--shadow);
  transition:transform .4s var(--spring); pointer-events:none;
}
.toast.show { transform:translate(-50%,0); }
.toast.err { border-color:rgba(231,76,60,0.5); color:#ff9a8b; }

/* 拖放高亮 */
body.dragging::after {
  content:'松开以载入 PDF'; position:fixed; inset:12px; z-index:300;
  border:2.5px dashed var(--accent); border-radius:22px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; color:var(--accent); background:rgba(0,0,0,0.35);
  pointer-events:none;
}
</style>
</head>
<body>

<div class="bg-wrap">
  <div class="orb cyan"></div>
  <div class="orb purple"></div>
  <div class="orb teal"></div>
</div>

<!-- 主卡片 -->
<div class="card">
  <h1>PDF 翻译器</h1>
  <div class="sub">学术 PDF 整册翻译 · 版面保留 · 公式/表格原位回贴 · v0.5.1</div>

  <div class="field">
    <input type="text" id="inputPath" placeholder="翻译原文件路径 (.pdf)" spellcheck="false">
    <button class="icon-btn" id="browseInput" title="浏览文件">📂</button>
  </div>
  <div class="field">
    <input type="text" id="outputDir" placeholder="输出目录（默认与源文件同目录）" spellcheck="false">

<script>
const $ = id => document.getElementById(id);
const api = async (url, opts) => {
  const r = await fetch(url, opts ? {headers:{'Content-Type':'application/json'}, ...opts} : undefined);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
};
let toastTimer = null;
function toast(msg, isErr=false) {
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 设置 ---------- */
const PROVIDERS = ['deepseek','zhipu','gemini','siliconflow','openai','ollama','lmstudio'];
// v0.4.2: 多语言（源/目标共用清单；输出排版按目标语言选字体，见 translator/langs.py）
// v0.5.1: 解锁 RTL（阿拉伯语/希伯来语）与天城文（印地语）——htmlbox 引擎整形
const LANGS = [
  ['en','English'], ['zh','中文（简体）'], ['ja','日本語'], ['ko','한국어'],
  ['de','Deutsch'], ['fr','Français'], ['es','Español'], ['it','Italiano'],
  ['pt','Português'], ['ru','Русский'], ['tr','Türkçe'], ['vi','Tiếng Việt'],
  ['ar','العربية (RTL)'], ['he','עברית (RTL)'], ['hi','हिन्दी'],
];
let CFG = {};

(function initLangs() {
  [['cfg-srclang','en'], ['cfg-tgtlang','zh']].forEach(([id, dft]) => {
    const sel = $(id);
    LANGS.forEach(([code, name]) => {
      const o = document.createElement('option');
      o.value = code; o.textContent = name;
      sel.appendChild(o);
    });
    sel.value = dft;
  });
})();

async function loadConfig() {
  try {
    const d = await api('/api/config');
    CFG = d.config || {};
    const llm = CFG.llm || {};
    $('cfg-provider').value = llm.provider || 'deepseek';
    $('cfg-model').value = llm.model || '';
    $('cfg-key').placeholder = llm.has_key ? `已保存 (${llm.api_key_masked})` : '未设置';
    $('cfg-fallback').value = llm.fallback_model || '';
    $('cfg-baseurl').value = llm.base_url || '';
    $('cfg-srclang').value = (CFG.io||{}).source_lang || 'en';
    $('cfg-tgtlang').value = (CFG.io||{}).target_lang || 'zh';
    $('cfg-glossary').value = CFG.glossary_file || '';
    $('cfg-formatting').checked = (CFG.features||{}).preserve_formatting !== false;
    $('cfg-watermark').checked = (CFG.features||{}).watermark_removal !== false;
    $('cfg-bilingual').checked = !!(CFG.features||{}).bilingual;
    $('cfg-renderer').value = (CFG.features||{}).renderer || 'htmlbox';
    $('cfg-fitmode').value = (CFG.fit||{}).mode || 'auto';
    $('cfg-ocrmode').value = (CFG.ocr||{}).mode || 'appendix';
    // v0.7.0: OCR 引擎多选（engines 空 = 单引擎 engine）
    const ocrEngines = (CFG.ocr||{}).engines
      || ((CFG.ocr||{}).engine ? [(CFG.ocr||{}).engine] : ['paddle']);
    $('cfg-ocr-paddle').checked = ocrEngines.includes('paddle');
    $('cfg-ocr-rapidocr').checked = ocrEngines.includes('rapidocr');
    $('cfg-ocr-tesseract').checked = ocrEngines.includes('tesseract');
    $('cfg-cache').checked = (CFG.features||{}).translation_cache !== false;
    $('cfg-glosslock').checked = (CFG.features||{}).glossary_lock !== false;
    $('cfg-workers').value = llm.max_workers ?? 3;
    $('cfg-batchsize').value = llm.batch_size ?? 6;
    $('cfg-batchchars').value = llm.batch_char_budget ?? 3000;
    $('cfg-rpm').value = llm.rpm_limit ?? 0;
    $('cfg-tpm').value = llm.tpm_limit ?? 0;
    const perf = CFG.performance || {};
    $('cfg-layoutworkers').value = perf.layout_workers ?? 0;
    $('cfg-overlap').value = perf.pipeline_overlap || 'auto';
    $('cfg-stream').checked = ((CFG.llm||{}).stream !== false);
    $('cfg-sentcache').checked = ((CFG.llm||{}).sentence_cache !== false);
    $('cfg-interval').value = llm.min_call_interval ?? 2;
    $('cfg-maxcalls').value = llm.max_llm_calls ?? 40;
    $('cfg-retries').value = llm.max_retries ?? 2;
    $('cfg-temperature').value = llm.temperature ?? 0;
    $('cfg-timeout').value = llm.timeout ?? 120;
    $('cfg-backoffbase').value = llm.backoff_base ?? 8;
    $('cfg-backoffcap').value = llm.backoff_cap ?? 30;
    $('cfg-retrycaps').value = llm.retry_delay_cap ?? 60;
    // v0.5.2: 批量导入的来源文件清单随配置持久化——翻译时加载的是合并文件，

    glzSources = Array.isArray(CFG.glossary_sources) && CFG.glossary_file

  } catch(e) { console.warn('loadConfig', e); }
}

    },

/* ---------- v0.5.2: 问号/chip 通用 tooltip ----------
   带 data-tip 的元素（设置项问号、已加载术语表 chip）悬停或点按时
   浮动显示说明，光标移开/点击其它位置/滚动即消失。
   浮层挂在 body 上按视口坐标定位（模态有 overflow 裁剪，不能放行内）。 */
const uiTip = document.createElement('div');
uiTip.id = 'uiTip';
uiTip.setAttribute('role', 'tooltip');
document.body.appendChild(uiTip);

function showUiTip(el) {
  const text = el.dataset.tip;
  if (!text) return;
  uiTip.textContent = text;
  uiTip.classList.add('show');
  const r = el.getBoundingClientRect();
  const tw = uiTip.offsetWidth, th = uiTip.offsetHeight;
  let left = r.left + r.width / 2 - tw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
  let top = r.bottom + 8;
  if (top + th > window.innerHeight - 8) top = Math.max(8, r.top - th - 8);
  uiTip.style.left = left + 'px';
  uiTip.style.top = top + 'px';
}
function hideUiTip() { uiTip.classList.remove('show'); }

document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showUiTip(el);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest && e.target.closest('[data-tip]')) hideUiTip();
});
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showUiTip(el);   // 触屏无 hover，点按同样显示
  else hideUiTip();        // 点击浮层外任意位置关闭
});
document.addEventListener('scroll', hideUiTip, true);   // 捕获阶段覆盖模态内滚动

let browseTarget = null;   // 'input' | 'output' | 'glossary'
let browseSel = null;
let browseChecked = new Set();   // glossary 模式多选
// v0.5.2: 术语表「添加文件/目录」记住上次选择的目录（localStorage 持久，跨会话）；
// 记录的目录被移动/删除时回退服务端默认起点（/mnt/c/Users → 用户主目录）
const GLZ_LAST_DIR_KEY = 'glzLastDir';

function glzLastDir() {
  try { return localStorage.getItem(GLZ_LAST_DIR_KEY) || ''; }
  catch(e) { return ''; }
}

function openBrowse(target) {
  browseTarget = target; browseSel = null; browseChecked.clear();
  $('browseSelect').textContent = target === 'output' ? '选定此目录'
    : target === 'glossary' ? '加入术语表（勾选项）' : '选定此文件';
  openModal($('browseModal'), $('browseBackdrop'));

  browseTo(start).then(ok => { if (!ok && start) browseTo(''); });
}
function parentOf(p) { const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\')); return i > 0 ? p.slice(0, i) : ''; }
$('browseInput').onclick = () => openBrowse('input');

async function browseTo(path) {
  // v0.5.2: 返回是否成功——打开时记忆目录失效需感知并回退默认起点
  try {
    const d = await api('/api/browse?path=' + encodeURIComponent(path));
    $('browseCur').value = d.path;
    const list = $('fileList'); list.innerHTML = '';
    if (d.parent) {
      const up = document.createElement('div');
      up.className = 'file-item';
      up.innerHTML = '<span class="ic">⬆️</span><span>..</span>';
      up.onclick = () => browseTo(d.parent);
      list.appendChild(up);
    }
    d.entries.forEach(e => {
      const it = document.createElement('div');
      it.className = 'item file-item';
      const isGlz = browseTarget === 'glossary';
      const chk = e.dir || isGlz
        ? '' : `<span class="chk${browseChecked.has(d.path + '/' + e.name) ? ' on' : ''}">${browseChecked.has(d.path + '/' + e.name) ? '✓' : ''}</span>`;
      it.innerHTML = `${chk}<span class="ic">${e.dir ? '📁' : '📄'}</span><span>${e.name}</span>`;
      if (!e.dir && !e.name.toLowerCase().endsWith('.pdf') && !isGlz) {
        it.style.opacity = '.4';   // 非PDF淡化但可选目录进入
      }
      it.onclick = () => {
        if (isGlz && !e.dir) {
          const p = d.path + '/' + e.name;
          if (browseChecked.has(p)) { browseChecked.delete(p); it.classList.remove('selected'); }
          else { browseChecked.add(p); it.classList.add('selected'); }
          $('browseSelect').textContent = `加入术语表（${browseChecked.size} 项）`;
          return;
        }
        list.querySelectorAll('.file-item').forEach(x => x.classList.remove('selected'));
        it.classList.add('selected');
        if (e.dir) browseSel = {dir:true, path: d.path + '/' + e.name};
        else browseSel = {dir:false, path: d.path + '/' + e.name};
      };
      it.ondblclick = () => { if (e.dir) browseTo(d.path + '/' + e.name); };
      list.appendChild(it);
    });
    return true;
  } catch(err) { toast(err.message, true); return false; }
}
$('browseUp').onclick = () => browseTo(parentOf($('browseCur').value));
$('browseSelect').onclick = () => {
  if (browseTarget === 'glossary') {
    if (!browseChecked.size) { toast('先勾选术语表文件', true); return; }
    browseChecked.forEach(p => { if (!glzPaths.includes(p)) glzPaths.push(p); });
    try { localStorage.setItem(GLZ_LAST_DIR_KEY, $('browseCur').value); } catch(e) {}
    renderGlzChips();
    closeModal($('browseModal'), $('browseBackdrop'));
    // v0.5.2 修复：旧版加入文件后不重开管理弹窗，用户看不到刚加的文件
    openModal($('glossaryModal'), $('glossaryBackdrop'));
    glzPreview();
    return;
  }
  if (!browseSel) { toast('先选中一项', true); return; }
  if (browseTarget === 'input') {
    if (browseSel.dir) { browseTo(browseSel.path); browseSel = null; return; }
    $('inputPath').value = browseSel.path;
  } else {
    $('outputDir').value = browseSel.dir ? browseSel.path : parentOf(browseSel.path);
  }
  closeModal($('browseModal'), $('browseBackdrop'));
};

/* ---------- 术语表批量管理 ---------- */
let glzPaths = [];     // 已选术语表文件路径（合并顺序=数组顺序，后者覆盖）

async function openGlossaryManager() {

  // 用户能看到上次加了哪几份、继续追加；否则退回单文件模式
  glzPaths = existing ? (glzSources.length ? [...glzSources] : [existing]) : [];

async function glzPreview() {
  if (!glzPaths.length) { toast('先添加术语表文件', true); return; }
  try {
    const d = await api('/api/glossary/preview', { method:'POST', body: JSON.stringify({ paths: glzPaths }) });
    glzContent = d.merged_text || '';
    $('glossaryBox').value = glzContent;
    const host = $('glzIssues'); host.innerHTML = '';
    (d.issues || []).forEach(iss => {
      const row = document.createElement('div');
      row.className = 'issue-row ' + iss.kind;
      row.innerHTML = `<span class="ln">${iss.file}${iss.line > 0 ? ':' + iss.line : ''}</span><span class="msg">${iss.msg}</span>`;
      host.appendChild(row);
    });
    if (d.ok) {
      toast(`合并预览 OK：${d.term_count} 条术语`);
      $('glzMeta').textContent = `${d.term_count} 条`;
    } else {
      toast('存在错误：请修正后再保存', true);
      $('glzMeta').textContent = `${d.term_count || 0} 条（含错误）`;
    }
  } catch(e) { toast(e.message, true); }
}

async function glzSave() {
  const text = $('glossaryBox').value;
  if (!text.trim()) { toast('术语表为空', true); return; }
  let d;
  try {
    const r = await fetch('/api/glossary/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    d = await r.json().catch(() => ({}));
  } catch(e) { toast('保存请求失败: ' + e.message, true); return; }
  if (d.ok) {
    $('cfg-glossary').value = d.path;
    glzSources = [...glzPaths];   // v0.5.2: 记住合并来源，供清单展示与下次回显
    refreshGlossaryStatus();   // v0.5.2: 保存后立即显示「已加载」
    toast(`已保存：${d.term_count} 条术语`);
    closeModal($('glossaryModal'), $('glossaryBackdrop'));
  } else if (d.issues) {
    const host = $('glzIssues'); host.innerHTML = '';
    d.issues.forEach(iss => {
      const row = document.createElement('div');
      row.className = 'issue-row ' + iss.kind;
      row.innerHTML = `<span class="ln">${iss.line > 0 ? 'L' + iss.line : ''}</span><span class="msg">${iss.msg}</span>`;
      host.appendChild(row);
    });
    toast(`校验未通过：${d.issues.filter(i => i.kind === 'error').length} 个错误`, true);
  } else {
    toast(d.detail || '保存失败', true);
  }
}

/* ---------- v0.5.2: 术语表加载状态 ----------
   路径非空时向服务端查询存在性/校验/条目数，行内显示「已加载 · N 条术语」；
   文件缺失或校验不过则红字提示——此前 UI 无法知晓术语表是否真的加载。
   同时在输入框下方列出翻译时会加载的术语表来源文件（批量导入可一次
   合并多份，合并结果存为单一文件，来源清单随配置持久化，点 chip 显示完整路径）。 */
let glzStatusTimer = null;
let glzSources = [];   // 批量导入的来源文件路径（顺序=合并顺序，后者覆盖）

function activeGlossaryFiles() {
  // 手动改过路径（glzSources 被清）→ 单文件模式，清单就是当前路径
  const cur = $('cfg-glossary').value.trim();
  return glzSources.length ? glzSources.slice() : (cur ? [cur] : []);
}

function renderGlzLoaded(loaded) {
  const host = $('glzLoaded'); host.innerHTML = '';
  activeGlossaryFiles().forEach(fp => {
    const c = document.createElement('span');
    c.className = 'chip' + (loaded ? '' : ' unloaded');
    c.dataset.tip = fp;                       // 点按/悬停显示完整路径
    const b = document.createElement('b');
    b.textContent = fp.split(/[\\/]/).pop().replace(/\.(yaml|yml|json)$/i, '');
    const st = document.createElement('span');
    st.className = 'st';
    st.textContent = loaded ? '已加载' : '未加载';
    c.append(b, st);
    host.appendChild(c);
  });
}

async function refreshGlossaryStatus() {
  const el = $('glzStatus');
  const p = $('cfg-glossary').value.trim();
  if (!p) {
    el.textContent = ''; el.className = '';
    renderGlzLoaded(false);
    return;
  }
  el.textContent = '检查中…'; el.className = '';
  try {
    const d = await api('/api/glossary/status?path=' + encodeURIComponent(p));
    const ok = d.exists && d.ok;
    if (!d.exists) { el.textContent = '⚠ 文件不存在'; el.className = 'bad'; }
    else if (!d.ok) { el.textContent = `⚠ 校验未通过（${d.term_count} 条可用）`; el.className = 'bad'; }
    else if (!d.term_count) { el.textContent = '✓ 已加载 · 空术语表'; el.className = 'ok'; }
    else { el.textContent = `✓ 已加载 · ${d.term_count} 条术语`; el.className = 'ok'; }
    renderGlzLoaded(ok);
  } catch(e) {
    // 404 = 服务端进程是旧版（index.html 实时读盘是新的，路由是启动时加载的）
    el.textContent = /not found|404/i.test(e.message)
      ? '⚠ 状态接口不可用（服务端为旧进程，请重启 run_ui.py）'
      : '⚠ ' + e.message;
    el.className = 'bad';
    renderGlzLoaded(false);
  }
}
$('cfg-glossary').addEventListener('input', () => {
  glzSources = [];   // 手动改动路径 → 旧来源清单不再代表将要加载的内容
  clearTimeout(glzStatusTimer);
  glzStatusTimer = setTimeout(refreshGlossaryStatus, 400);   // 防每键一查
});

let pollTimer = null;

async function refreshJob() {
  try {
    const j = await api('/api/jobs/current');
    updateProgressUI(j);
    return j;
  } catch(e) { return null; }

function setBar(pct, indet=false) {
  const bar = $('barFill');
  bar.classList.toggle('indeterminate', indet);
  bar.style.width = pct + '%';
}

const STAGE_NAMES = { layout: '布局分析', translate: 'LLM 翻译', render: '渲染回灌' };
const TERMINAL = ['done', 'error', 'cancelled'];

function updateProgressUI(j) {
  const zone = $('progressZone');
  const btn = $('btnTranslate');
  if (!j || j.status === 'idle') j = {status: 'idle', queue_len: j?.queue_len ?? 0};
  const busy = ['queued','running','paused'].includes(j.status);
  // v0.4.3 修复：终态（完成/出错/取消）保持进度区展开展示结果——
  // 仅 idle（无任务）时收起
  if (busy || TERMINAL.includes(j.status)) {
    zone.classList.add('open');
  } else {
    zone.classList.remove('open');
  }
  // v0.4.3: 按钮不再禁用——忙时提交进入任务队列（服务端 MAX_QUEUE 兜底）；
  // 提交请求在飞时由 submitting 标志防连点
  if (busy) {
    btn.textContent = j.status === 'paused' ? '已暂停 ⏸' : '翻译中…';
    $('btnPause').textContent = j.status === 'paused' ? '▶ 继续' : '⏸ 暂停';
  } else {
    btn.textContent = '翻 译';
  }
  $('btnPause').style.visibility = busy ? 'visible' : 'hidden';
  $('btnCancel').style.visibility = busy ? 'visible' : 'hidden';
  // 状态行：阶段 + 进度（v0.4.2：旧版只写死「启动中…」，无任何进度数字）
  if (busy) {
    let s = STAGE_NAMES[j.stage] || (j.status === 'paused' ? '已暂停' : '处理中…');
    const p = j.progress;
    if (p && p.total > 0) {
      const unit = p.unit === 'batch' ? '批' : '页';
      s = `${s} ${p.done}/${p.total} ${unit}`
        + (p.unit === 'batch' && p.calls ? ` · ${p.calls} 次调用` : '');
    }
    if (j.status === 'paused') s = `⏸ 已暂停（${s}）`;
    if (j.queue_len > 0) s += ` · 队列中还有 ${j.queue_len} 个任务`;
    $('statusLine').textContent = s;
    if (p && p.total > 0) setBar(Math.round(100 * p.done / p.total));
    else setBar(0, true);
  }
  // v0.5.0: 警告列表（服务端 v0.5.0 起透传管线 warning 事件，旧版被丢弃）
  if (Array.isArray(j.warnings) && j.warnings.length) {
    const host = $('warnList');
    const known = new Set(Array.from(host.children).map(el => el.dataset.w));
    j.warnings.slice(-30).forEach(w => {
      if (known.has(w)) return;
      const d = document.createElement('div');
      d.dataset.w = w;
      d.textContent = '⚠ ' + w;
      host.appendChild(d);
      host.scrollTop = host.scrollHeight;
    });
  }
  if (j.output_path) {
    $('doneRow').classList.add('show');
    // v0.4.2：file:// 链接被 Chrome/Edge 从 http 页面拦截
    // （Not allowed to load local resource）→ 改走服务端转发预览
    $('doneLink').href = '/api/output?path=' + encodeURIComponent(j.output_path);
    $('doneLink').target = '_blank';
    const st = [];
    if (j.pages) st.push(`${j.pages} 页`);
    if (j.calls != null) st.push(`${j.calls} 次调用`);
    // v0.5.1: 缓存节省报表（命中段折算批次数）
    if (j.cache_hits > 0) {
      st.push(`缓存命中 ${j.cache_hits} 段`);
      if (j.cache_saved_calls > 0) st.push(`省约 ${j.cache_saved_calls} 次调用`);
    }
    if (j.elapsed) st.push(`${j.elapsed}s`);
    $('doneStats').textContent = st.length ? `（${st.join(' · ')}）` : '';
    $('statusLine').textContent = '✅ 完成';
  }
  if (j.status === 'error') { $('statusLine').textContent = '❌ ' + (j.error || '失败'); }
  if (j.status === 'cancelled') { $('statusLine').textContent = '已取消'; }
}

/* ---- v0.5.0: SSE 实时流（优先），失败自动退回轮询 ---- */
let sse = null, sseHealthy = false;
function startSSE() {
  if (!window.EventSource || sse) return;
  try { sse = new EventSource('/api/jobs/current/stream'); } catch(e) { sse = null; return; }
  sse.onopen = () => { sseHealthy = true; };
  sse.onmessage = (m) => {
    sseHealthy = true;
    let d; try { d = JSON.parse(m.data); } catch(e) { return; }
    if (d.kind === 'state') {
      const cur = d.current
        ? {...d.current, queue_len: d.current.queue_len ?? d.queue_len ?? 0}
        : {status: 'idle', queue_len: d.queue_len ?? 0};
      updateProgressUI(cur);
    } else if (d.kind === 'job_event') {
      const job = d.job || {};
      job.queue_len = job.queue_len ?? lastQueueLen ?? 0;
      updateProgressUI(job);
    }
  };
  sse.onerror = () => { sseHealthy = false; };   // EventSource 自动重连
}
let lastQueueLen = 0;
const _origUpdate = updateProgressUI;
updateProgressUI = function(j) {
  if (j && typeof j.queue_len === 'number') lastQueueLen = j.queue_len;
  _origUpdate(j);
};

/* v0.5.0: 取消当前或排队中的任务（服务端 find 支持队列） */
async function cancelCurrent() {
  try {
    const st = await api('/api/jobs');
    const id = st.current?.id || (st.queued || [])[0]?.id;
    if (!id) { toast('当前没有可取消的任务'); return; }
    await api(`/api/jobs/${id}/cancel`, {method:'POST'});
    toast('取消中…（当前批次完成后停止）');
  } catch(e) { toast(e.message, true); }
}

/* ---- 轮询兜底：SSE 健康时降频到 20s 校准，否则维持动态间隔 ---- */
let pollActive = false;
function startPolling() {
  if (pollTimer) return;
  const tick = async () => {
    if (sseHealthy) return;              // SSE 在流，轮询只作断连兜底
    const j = await refreshJob();
    const busy = ['queued','running','paused'].includes(j?.status || 'idle');
    // 忙时 1.2s 快轮询；空闲 15s 慢轮询（动态换 interval）
    const want = busy ? 1200 : 15000;
    if (want !== curInterval) {
      curInterval = want;
      clearInterval(pollTimer);
      pollTimer = setInterval(tick, want);
    }
  };
  let curInterval = 1200;
  pollTimer = setInterval(tick, curInterval);
  // SSE 健康监测：每 20s 探一次，SSE 断连时轮询自然接管
  setInterval(() => { if (!sseHealthy) tick(); }, 20000);
}

let submitting = false;
$('btnTranslate').onclick = async () => {
  const input = $('inputPath').value.trim();
  if (!input) { toast('先填输入 PDF 路径', true); return; }
  if (submitting) return;   // v0.4.3: 请求在飞时防连点
  submitting = true;
  try {
    await saveConfigSilent();
    const r = await api('/api/translate', {method:'POST', body: JSON.stringify({
      input, output_dir: $('outputDir').value.trim(), config: CFG,
    })});
    $('warnList').textContent = ''; $('doneRow').classList.remove('show');
    if (r.queued) {
      toast(`已加入队列（当前任务完成后自动开始）`);
    } else {
      $('statusLine').textContent = '启动中…'; setBar(0, true);
    }
    startPolling();
  } catch(e) { toast(e.message, true); }
  finally { submitting = false; }
};
async function saveConfigSilent() {
  CFG = collectConfig();
  await api('/api/config', {method:'PUT', body: JSON.stringify({config: CFG})});
}

$('btnPause').onclick = async () => {
  const j = await refreshJob(); if (!j?.id) return;
  const action = j.status === 'paused' ? 'resume' : 'pause';
  await api(`/api/jobs/${j.id}/${action}`, {method:'POST'});
  refreshJob();
};
$('btnCancel').onclick = cancelCurrent;

/* ---------- 任务历史（v0.5.1：数据在 SQLite 与 /api/jobs，前端列表视图） ---------- */
const HIST_STATUS = { done: '✓ 完成', error: '✗ 失败', cancelled: '已取消' };

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function openHistory() {
  openModal($('historyModal'), $('historyBackdrop'));
  const host = $('histList');
  host.innerHTML = '<div class="hist-empty">加载中…</div>';
  let d;
  try { d = await api('/api/jobs'); }
  catch (e) { host.innerHTML = `<div class="hist-empty">${e.message}</div>`; return; }
  const hist = d.history || [];
  if (!hist.length) {
    host.innerHTML = '<div class="hist-empty">暂无历史任务</div>';
    return;
  }
  host.innerHTML = '';
  hist.forEach(h => host.appendChild(renderHistItem(h)));
}

function renderHistItem(h) {
  const it = document.createElement('div');
  it.className = 'hist-item';
  const file = (h.input || '').split(/[\\/]/).pop() || h.input || '(未知输入)';
  const warns = h.warnings || [];
  const meta = [];
  if (h.pages) meta.push(`${h.pages} 页`);
  if (h.calls != null) meta.push(`${h.calls} 次调用`);
  if (h.cache_hits > 0) {
    meta.push(`缓存命中 ${h.cache_hits} 段`);
    if (h.cache_saved_calls > 0) meta.push(`省约 ${h.cache_saved_calls} 次`);
  }
  if (h.elapsed) meta.push(`${h.elapsed}s`);
  meta.push(fmtTime(h.created));
  it.innerHTML = `
    <div class="hist-top">
      <span class="hist-file" title="${h.input || ''}">${file}</span>
      <span class="hist-badge ${h.status}">${HIST_STATUS[h.status] || h.status}</span>
    </div>
    ${h.error ? `<div class="hist-meta" style="color:#ff9a8b;">${h.error}</div>` : ''}
    <div class="hist-meta"><span>${meta.join(' · ')}</span></div>
    <div class="hist-actions">
      ${h.input ? '<button data-act="rerun">↻ 重跑</button>' : ''}
      ${h.output_path ? '<button data-act="open">📄 打开输出</button>' : ''}
      ${warns.length ? `<button data-act="warns">⚠ 警告 (${warns.length})</button>` : ''}
    </div>
    <div class="hist-warns" style="display:none;">${
      warns.map(w => `<div>⚠ ${w}</div>`).join('')}</div>`;
  const btnRerun = it.querySelector('[data-act=rerun]');
  if (btnRerun) btnRerun.onclick = async () => {
    // 重跑：沿用历史任务的输入/输出目录 + 当前 UI 配置（模型/语言等）
    try {
      await saveConfigSilent();
      const r = await api('/api/translate', {method: 'POST', body: JSON.stringify({
        input: h.input, output_dir: h.output_dir || '', config: CFG,
      })});
      closeModal($('historyModal'), $('historyBackdrop'));
      $('inputPath').value = h.input;
      if (h.output_dir) $('outputDir').value = h.output_dir;
      toast(r.queued ? '已加入队列（重跑）' : '重跑已启动');
      startPolling();
    } catch (e) { toast(e.message, true); }
  };
  const btnOpen = it.querySelector('[data-act=open]');
  if (btnOpen) btnOpen.onclick = () => {
    window.open('/api/output?path=' + encodeURIComponent(h.output_path), '_blank');
  };
  const btnWarns = it.querySelector('[data-act=warns]');
  if (btnWarns) btnWarns.onclick = () => {
    const el = it.querySelector('.hist-warns');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  };
  return it;
}

$('btnHistory').onclick = openHistory;
$('closeHistory').onclick = () => closeModal($('historyModal'), $('historyBackdrop'));
$('historyBackdrop').onclick = () => closeModal($('historyModal'), $('historyBackdrop'));

/* ---------- 拖放 ---------- */
['dragenter','dragover'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('dragging'); }));
['dragleave','drop'].forEach(ev =>
  document.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget) return;
    document.body.classList.remove('dragging');
    if (ev === 'drop' && e.dataTransfer.files.length) {
      $('inputPath').value = e.dataTransfer.files[0].name;   // 浏览器只给文件名
      toast('浏览器安全限制只能拿到文件名，请用 📂 选完整路径', true);
    }
  }));

/* ---------- init ---------- */
loadConfig();
startPolling();
startSSE();

// 进度条事件驱动增强：SSE 推送为主（v0.5.0），轮询兜底
</script>
