# 新测试样张: arxiv 2308.13658 (IEEE 双栏 8页,10公式,22+文献)
io:
  input: "paper.pdf"                # 待翻译 PDF 路径
  output_dir: "out"                 # 输出目录，生成 <文件名>-<目标语言>.pdf
  # 源/目标语言（v0.5.1 支持 15 种，输出排版按目标语言自动选字体）：
  #   zh 简体中文 | en 英文 | ja 日语 | ko 韩语
  #   de 德语 | fr 法语 | es 西语 | it 意语 | pt 葡语 | tr 土语 | vi 越南语
  #   ru 俄语 | ar 阿拉伯语(RTL) | he 希伯来语(RTL) | hi 印地语(天城文)
  source_lang: en                   # 版面识别启发式针对英文文献优化
  target_lang: zh

llm:
  # ---- Provider 选择（详见 README Provider 配置表）----
  provider: deepseek                # deepseek / zhipu / gemini / siliconflow / openai / ollama / lmstudio
  api_key: ""                       # 留空则读环境变量 DEEPSEEK_API_KEY 等
  base_url: ""                      # 留空用 preset 默认；自建 endpoint 填这里
  model: "deepseek-v4-flash"
  fallback_model: ""                # 备用链，如 "glm-4.7-flash" 或 "m2, m3"

  # ---- 翻译质量 ----
  temperature: 0.0

  # ---- 调用频率控制（免费档/限流严的模型按 README 备注调整）----
  batch_size: 6                     # 每批段落数上限；限流严调小到 2-3
  batch_char_budget: 3000           # v0.4.3 每批字符预算：长短段不混批，
                                    # 降低长批超时失败率；0=仅按段数
                                    # （设置下方配额且此处未显式配置时，自动换算优先）
  rpm_limit: 0                      # v0.5.0 provider 每分钟请求配额（0=不启用）；
                                    # 设置后自动换算 min_call_interval=60/rpm
                                    # （YAML 里显式写出的配置项优先于自动值）
  tpm_limit: 0                      # v0.5.0 每分钟 token 配额；与 rpm 同设时
                                    # 自动换算批字符预算 (tpm/rpm)×3.2×0.8
  max_llm_calls: 40                 # 单文档调用上限
  min_call_interval: 2              # 相邻调用最小间隔秒；限流严调大到 5-10
  max_workers: 3                    # 并发数；免费档建议 1

  # ---- 速度（v0.7.0）----
  stream: true                      # 流式解码+首包即回：增量收 delta 逐对
                                    # 提交译文，收齐全部 id 即断流（省 10-30%
                                    # 批耗时）；网关不支持 stream 自动退非流式
  sentence_cache: true              # 句子级缓存：ref 条目/图注等模板文本按句
                                    # 跨文档复用（全命中才免调；上下文依赖句
                                    # 不启用）

  # ---- 重试与退避 ----
  timeout: 120.0                    # 单次请求超时秒（慢思考模型调大）
  max_retries: 2                    # 单批最大尝试次数（1=不重试直接降级）
  backoff_base: 8.0                 # 传输层失败退避基数秒
  backoff_cap: 30.0                 # 退避上限秒
  retry_delay_cap: 60.0             # 服务端建议等待的封顶秒

# ---- 本地性能（v0.4.3）----
performance:
  layout_workers: 0                 # 版面分析进程并行数；0=自动(min(4,CPU))，1=串行
  cache_max_entries: 50000          # 翻译缓存条目上限（0=不限制），超出淘汰最旧
  layout_engine: heuristic          # v0.5.0 版面引擎：heuristic=内置启发式（默认）；
                                    # pymupdf-layout=GNN 版面检测（需 pip install
                                    # pymupdf-layout，未装自动回退启发式并告警）
  layout_cache: true                # v0.5.1 版面结果落盘缓存（段落级断点续跑）：
                                    # 同一输入重跑跳过布局直达翻译（配合翻译
                                    # 缓存只剩增量段）；输入/引擎变化自动失效
  pipeline_overlap: auto            # v0.7.0 布局-翻译流水线重叠：auto=启发式
                                    # 引擎且页数≥12 时启用（布局后台逐页产出，
                                    # 翻译批随页发车，大文档省整段布局时间）；
                                    # on=无条件启用；off=关闭

features:
  watermark_removal: true           # 三层水印移除
  preserve_formatting: true         # 期刊排版（宋体正文/黑体标题）
  glossary_lock: true               # 术语一致性校验
  translation_cache: true           # SQLite 缓存，二次运行零调用
  bilingual: false                  # true=双语对照模式
  renderer: htmlbox                 # v0.5.1 渲染器：htmlbox=insert_htmlbox
                                    # HTML+CSS 排版引擎（默认，自带两端对齐/
                                    # 复杂文字整形，支持阿拉伯语等 RTL）；
                                    # writer=TextWriter 逐字排印（遗留路径）

# ---- 排版自适配（v0.6.0，仅 htmlbox 渲染器生效）----
fit:
  mode: auto                        # auto=两遍式渲染+降级阶梯（默认）；
                                    # off=关闭（回到 v0.5.1 元素级缩放行为）
  expand_lines: 1.0                 # 段落向下扩框上限（基准行高倍数；
                                    # 下探不越同栏下邻元素，参考文献不扩框）
  lead_steps: [0.95, 0.92]          # 行距降级阶梯（字号收缩前先微压行距）
  tracking: 0.995                   # 字距系数（阶梯最深一级生效；1=关闭）
  min_scale: 0.78                   # 样式类字号统一下限（标题类不缩字号）
  body_boost: 1.05                  # 收缩方向正文微升上限（EN→ZH 低填充
                                    # 文档微升字号提升可读性；1=关闭）

glossary_file: ""                   # 术语表 YAML 路径（可选）

fonts:
  cjk: ""                           # 留空自动探测（Windows/WSL/Linux/macOS）；
                                    # 或指定如 "C:/Windows/Fonts/simsun.ttc"
  # body: ""                        # 目标语言正文字体（中性名，同 cjk）
  # heading: ""                     # 目标语言标题字体

ocr:
  engine: paddle                    # 扫描件 OCR 主引擎（v0.4.3 起真实接入）：
                                    # paddle / rapidocr / tesseract；none=关闭。
                                    # 未安装则警告并保留原样
  engines: []                       # v0.7.0 多引擎投票：如 [paddle, rapidocr,
                                    # tesseract]——同行结果按 IoU 对齐，一致取
                                    # 一致、冲突取置信度最高并告警；空=单引擎
  min_chars: 50                     # 文字层少于此字符数的页视为扫描页
  mode: appendix                    # 译文呈现：appendix=附录页（默认）；
                                    # inplace=白块覆盖+原位回灌（与图形重叠的
                                    # 块自动跳过保留原样）；
                                    # reconstruct=版面自监督重建（v0.7.0）：
                                    #   区域几何来自影子页 GNN/几何分割（与
                                    #   OCR 识别质量解耦），译文按区域原位回灌
                                    #   + 原文对照附录页；需装 pymupdf-layout
                                    #   （未装自动退几何分割）
