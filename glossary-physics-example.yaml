# 物理学 / 量子材料 / 拓扑物态 术语表示例
# ============================================================
# 用法: 复制此文件,按需增删条目,然后在配置中指定:
#   glossary_file: "glossary-physics-example.yaml"
# 或在 Web UI: 设置 → 翻译 → 术语表 路径框填入本文件路径
